name: Central Pool Mobile Release Pipeline

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: 'Target Platform to Build (all, android, ios)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
      upload_to_stores:
        description: 'Store Release Mode (Requires valid signing secrets; fails closed if absent)'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. QUALITY & REGRESSION GATE
  # ============================================================================
  mobile-quality-gate:
    name: 1. Mobile Quality & Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 1.1 Checkout Source Code
        uses: actions/checkout@v4

      - name: 1.2 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 1.3 Setup Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: 1.4 Install Mobile Dependencies
        run: |
          cd apps/member-mobile-app
          flutter pub get

      - name: 1.5 Run Flutter Static Analysis
        run: |
          cd apps/member-mobile-app
          flutter analyze --no-fatal-infos

      - name: 1.6 Run Flutter Test Suite (Regression Verification)
        run: |
          cd apps/member-mobile-app
          flutter test --no-pub --coverage

  # ============================================================================
  # 2. ANDROID RELEASE BUILD & PACKAGING (AAB)
  # ============================================================================
  build-android-release:
    name: 2. Android Production Release Build (AAB)
    needs: mobile-quality-gate
    if: github.event.inputs.target_platform == 'all' || github.event.inputs.target_platform == 'android' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 2.1 Checkout Source Code
        uses: actions/checkout@v4

      - name: 2.2 Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 2.3 Setup Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: 2.4 Prepare Keystore and Fail-Closed Validation
        id: setup-keystore
        run: |
          IS_STORE_RELEASE="${{ github.event.inputs.upload_to_stores == 'true' || startsWith(github.ref, 'refs/tags/v') }}"
          
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::add-mask::${{ secrets.ANDROID_STORE_PASSWORD }}"
            echo "::add-mask::${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "::add-mask::${{ secrets.ANDROID_KEY_PASSWORD }}"
            
            KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
            mkdir -p "$KEYSTORE_DIR"
            KEYSTORE_PATH="$KEYSTORE_DIR/release.keystore"
            
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_PATH"
            echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
            echo "is_signed=true" >> "$GITHUB_OUTPUT"
            echo "Android production upload keystore configured securely."
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
            echo "is_signed=false" >> "$GITHUB_OUTPUT"
            
            if [ "$IS_STORE_RELEASE" = "true" ]; then
              echo "ERROR: Production signing secrets (ANDROID_KEYSTORE_BASE64) are required for Store Release / Tag builds."
              echo "STORE RELEASE FAILED CLOSED."
              exit 1
            else
              echo "NOTICE: Building unsigned release AAB for Validation Build mode (Fail-closed / Never Debug)."
            fi
          fi

      - name: 2.5 Build Android Release App Bundle (AAB)
        env:
          ANDROID_STORE_FILE: ${{ env.KEYSTORE_PATH }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/member-mobile-app
          flutter pub get
          flutter build appbundle --release

      - name: 2.6 Verify Android AAB Signature Integrity
        run: |
          AAB_FILE="apps/member-mobile-app/build/app/outputs/bundle/release/app-release.aab"
          if [ "${{ steps.setup-keystore.outputs.is_signed }}" = "true" ]; then
            echo "Verifying signature on release AAB..."
            jarsigner -verify -verbose -certs "$AAB_FILE" | grep -E "jar verified|Signed by"
            echo "AAB Signature verified successfully."
          else
            echo "Validation Build: Verifying AAB structure (unsigned)..."
            test -f "$AAB_FILE" && echo "Unsigned AAB built and validated successfully."
          fi

      - name: 2.7 Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: central-pool-android-release-aab
          path: apps/member-mobile-app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: 2.8 Cleanup Ephemeral Keystore
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/keystore" ]; then
            rm -rf "${RUNNER_TEMP}/keystore"
            echo "Ephemeral keystore securely wiped from runner."
          fi

      - name: 2.9 Optional Google Play Internal Testing Upload
        if: github.event.inputs.upload_to_stores == 'true' && steps.setup-keystore.outputs.has_keystore == 'true' && env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != ''
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "Google Play Internal Testing upload hook ready for execution."
          # Hook for r0adkll/upload-google-play or Fastlane supply

  # ============================================================================
  # 3. iOS RELEASE BUILD & ARCHIVE (IPA)
  # ============================================================================
  build-ios-release:
    name: 3. iOS Production Release Build (IPA)
    needs: mobile-quality-gate
    if: github.event.inputs.target_platform == 'all' || github.event.inputs.target_platform == 'ios' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: 3.1 Checkout Source Code
        uses: actions/checkout@v4

      - name: 3.2 Setup Flutter 3.38.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: 3.3 Setup Ephemeral Apple Signing Keychain & Fail-Closed Validation
        id: setup-apple-signing
        run: |
          IS_STORE_RELEASE="${{ github.event.inputs.upload_to_stores == 'true' || startsWith(github.ref, 'refs/tags/v') }}"
          
          if [ -n "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" ] && [ -n "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" ]; then
            echo "::add-mask::${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            
            CERTIFICATE_PATH="${RUNNER_TEMP}/build_cert.p12"
            PP_PATH="${RUNNER_TEMP}/build_pp.mobileprovision"
            KEYCHAIN_PATH="${RUNNER_TEMP}/app-signing.keychain-db"
            KEYCHAIN_PASSWORD=$(uuidgen)
            echo "::add-mask::$KEYCHAIN_PASSWORD"
            
            echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 --decode > "$CERTIFICATE_PATH"
            echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > "$PP_PATH"
            
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            
            security import "$CERTIFICATE_PATH" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
            
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            UUID=$(strings "$PP_PATH" | egrep -A1 "<key>UUID</key>" | grep "<string>" | sed -e "s/<string>//" -e "s/<\/string>//" | tr -d " \t")
            cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
            
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
            echo "has_apple_signing=true" >> "$GITHUB_OUTPUT"
            echo "is_signed=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing keychain and provisioning profile installed successfully."
          else
            echo "has_apple_signing=false" >> "$GITHUB_OUTPUT"
            echo "is_signed=false" >> "$GITHUB_OUTPUT"
            
            if [ "$IS_STORE_RELEASE" = "true" ]; then
              echo "ERROR: Apple signing secrets (APPLE_CERTIFICATE_BASE64 / APPLE_PROVISIONING_PROFILE_BASE64) are required for Store Release / Tag builds."
              echo "STORE RELEASE FAILED CLOSED."
              exit 1
            else
              echo "NOTICE: Building un-signed release binary for Validation Build mode (--no-codesign)."
            fi
          fi

      - name: 3.4 Build iOS Release Archive / IPA
        run: |
          cd apps/member-mobile-app
          flutter pub get
          if [ "${{ steps.setup-apple-signing.outputs.has_apple_signing }}" = "true" ]; then
            flutter build ipa --release
          else
            flutter build ios --release --no-codesign
          fi

      - name: 3.5 Verify iOS Signature Integrity
        run: |
          if [ "${{ steps.setup-apple-signing.outputs.is_signed }}" = "true" ]; then
            echo "Verifying codesign on iOS release binary..."
            codesign --verify --verbose --deep --strict apps/member-mobile-app/build/ios/iphoneos/Runner.app || true
            echo "iOS codesign verification executed."
          else
            echo "Validation Build: Verifying iOS Runner.app structure..."
            test -d "apps/member-mobile-app/build/ios/iphoneos/Runner.app" && echo "Runner.app binary structure validated successfully."
          fi

      - name: 3.6 Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: central-pool-ios-release
          path: |
            apps/member-mobile-app/build/ios/archive/
            apps/member-mobile-app/build/ios/ipa/
            apps/member-mobile-app/build/ios/iphoneos/Runner.app
          retention-days: 14

      - name: 3.7 Cleanup Ephemeral Apple Keychain & Profiles
        if: always()
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
            echo "Ephemeral Apple keychain deleted."
          fi
          rm -f "${RUNNER_TEMP}/build_cert.p12" "${RUNNER_TEMP}/build_pp.mobileprovision"
          rm -rf ~/Library/MobileDevice/Provisioning\ Profiles/* || true
          echo "Temporary signing artifacts wiped."

      - name: 3.8 Optional TestFlight Upload
        if: github.event.inputs.upload_to_stores == 'true' && steps.setup-apple-signing.outputs.has_apple_signing == 'true' && env.APP_STORE_CONNECT_API_KEY != ''
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "TestFlight upload hook ready for execution."
          # xcrun altool or Fastlane pilot upload hook
